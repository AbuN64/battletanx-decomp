# Generated by unbake: every job calls ci/run. Board jobs run in a scheduled (daily) or manual pipeline.
check:
  image: python:3.11-slim@sha256:0dd364ba7e10242f07755449e3a3d0e35f9efd987952737b90def6709ab0c5ce
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make
  script:
    - sh ci/run check
  artifacts:
    paths:
      - versions/*/report.json

audit:
  image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - CI_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" sh ci/run audit

board-bytematch:
  image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  cache:
    key:
      prefix: board-bytematch
      files:
        - progress.json
    paths:
      - .boards/bytematch
  variables:
    REPO: $CI_PROJECT_PATH
    COMMIT: $CI_COMMIT_SHA
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl
  script:
    - sh ci/run board bytematch
