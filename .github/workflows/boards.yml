name: Boards
on:  # generated by unbake: once a day, and a board publishes only after progress.json changed since it last did
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when progress.json is unchanged
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bytematch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: seen
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .boards/bytematch
          key: board-bytematch-${{ hashFiles('progress.json') }}
      - env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BYTEMATCH_TOKEN: ${{ secrets.BYTEMATCH_TOKEN }}
        run: sh ci/run board bytematch
      - if: steps.seen.outputs.cache-hit != 'true' && hashFiles('.boards/bytematch') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .boards/bytematch
          key: board-bytematch-${{ hashFiles('progress.json') }}
  recomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: month  # artifacts expire: a board that reads them is fed again each month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: seen
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .boards/recomp
          key: board-recomp-${{ hashFiles('progress.json') }}-${{ steps.month.outputs.month }}
      - env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: sh ci/run board recomp
      - if: steps.seen.outputs.cache-hit != 'true' && hashFiles('.boards/recomp') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: us_report
          path: versions/us/report.json
          retention-days: 90
      - if: steps.seen.outputs.cache-hit != 'true' && hashFiles('.boards/recomp') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .boards/recomp
          key: board-recomp-${{ hashFiles('progress.json') }}-${{ steps.month.outputs.month }}
