name: CI
on:  # main runs at most once a day, and only after a change
  schedule:
    - cron: "0 12 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.age.outputs.recent }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: age
        run: echo "recent=$(( $(date +%s) - $(git log -1 --format=%ct) < 86400 ))" >> "$GITHUB_OUTPUT"
  check:
    needs: changed
    if: github.event_name != 'push' && (github.event_name != 'schedule' || needs.changed.outputs.recent == '1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make check CHECK=tree
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install https://github.com/AbuN64/cake-unbake-64/releases/download/v0.2.0/unbake-0.2.0-py3-none-any.whl
      - env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then BASE="origin/$BASE_REF"; else BASE="$BEFORE"; fi
          case "$BASE" in *0000000000000000000000000000000000000000) BASE=4b825dc642cb6eb9a060e54bf8d69288fbee4904;; esac
          unbake audit --against "$BASE"
